service: users-service

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  environment:
    USERS_TABLE: users-Users
    SESSION_SECRET: lss-secret
    EVENT_BUS_NAME: domain-events
    AWS_ENDPOINT: http://localhost:4572
  httpApi:
    cors: true
    authorizers:
      sessionAuthorizerV2:
        type: request
        functionName: sessionAuthorizerV2Local
        identitySource:
          - $request.header.authorization
        resultTtlInSeconds: 3600
        enableSimpleResponses: true
        payloadVersion: '2.0'

plugins:
  - serverless-lss

custom:
  orchestrator:
    enabled: true
    orchestratorUrl: http://localhost:3120
  lss:
    apiPort: 3610
    invokePort: 13610

functions:
  # v2 "simple response" authorizer ({isAuthorized, context}) — no events; it
  # backs the named provider.httpApi.authorizers entry above.
  sessionAuthorizerV2Local:
    handler: src/handlers/session-authorizer-v2.handler

  listUsers:
    handler: src/handlers/listUsers.handler
    events:
      - httpApi:
          path: /users
          method: get
          authorizer:
            name: sessionAuthorizerV2

  createUser:
    handler: src/handlers/createUser.handler
    events:
      - httpApi:
          path: /users
          method: post
          authorizer:
            name: sessionAuthorizerV2

  getUser:
    handler: src/handlers/getUser.handler
    events:
      - httpApi:
          path: /users/{id}
          method: get
          authorizer:
            name: sessionAuthorizerV2

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users-Users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

package:
  individually: false
