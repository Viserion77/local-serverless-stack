service: orders-service

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: dev
  environment:
    ORDERS_TABLE: orders-Orders
    ORDER_QUEUE_URL: http://localhost:4572/000000000000/orders-OrderQueue
    ORDER_EVENTS_TOPIC_ARN: arn:aws:sns:${self:provider.region}:${self:custom.accountId}:orders-OrderEvents
    UPLOADS_BUCKET: orders-uploads
    AWS_ENDPOINT: http://localhost:4572

plugins:
  - serverless-lss

custom:
  accountId: '000000000000'
  orchestrator:
    enabled: true
    orchestratorUrl: http://localhost:3120
  lss:
    apiPort: 3612
    invokePort: 13612

functions:
  # POST /orders — protected by a CROSS-SERVICE authorizer: the Lambda behind
  # the ARN lives in auth-service. LSS resolves the ARN against its global
  # function registry, so one authorizer can guard many services.
  createOrder:
    handler: src/handlers/createOrder.handler
    events:
      - http:
          path: /orders
          method: post
          cors: true
          authorizer:
            name: sessionAuthorizer
            arn: arn:aws:lambda:${self:provider.region}:${self:custom.accountId}:function:auth-service-${self:provider.stage}-sessionAuthorizer
            type: request
            identitySource: method.request.header.code
            resultTtlInSeconds: 3600

  listOrders:
    handler: src/handlers/listOrders.handler
    events:
      - http:
          path: /orders
          method: get
          cors: true
          authorizer:
            name: sessionAuthorizer
            arn: arn:aws:lambda:${self:provider.region}:${self:custom.accountId}:function:auth-service-${self:provider.stage}-sessionAuthorizer
            type: request
            identitySource: method.request.header.code
            resultTtlInSeconds: 3600

  # SQS consumer — LSS provisions the queue in LocalStack and pipes messages to
  # the runtime worker, no serverless-offline involved.
  processOrderQueue:
    handler: src/handlers/processOrderQueue.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - OrderQueue
              - Arn
          batchSize: 5

  # Schedule trigger emulation is a documented TODO — LSS still registers the
  # function, so it is invocable through the Lambda Invoke API on port 13612.
  cleanupExpiredOrders:
    handler: src/handlers/cleanupExpiredOrders.handler
    events:
      - schedule: rate(1 hour)

  # DynamoDB stream consumer — every write to orders-Orders (SQS consumer,
  # seeds, onUpload) flows through the table stream to this handler, which
  # publishes an order.* message to the orders-OrderEvents SNS topic.
  onOrderStream:
    handler: src/handlers/onOrderStream.handler
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt:
              - OrdersTable
              - StreamArn
          batchSize: 10

  # POST /uploads — public; writes the payload to s3://orders-uploads under
  # "incoming/" so the bucket notification below fires onUpload.
  uploadFile:
    handler: src/handlers/uploadFile.handler
    events:
      - http:
          path: /uploads
          method: post
          cors: true

  # GET /uploads — public; lists the bucket so the S3 round-trip is observable.
  listUploads:
    handler: src/handlers/listUploads.handler
    events:
      - http:
          path: /uploads
          method: get
          cors: true

  # Triggered when an object is created under "incoming/" in the uploads
  # bucket. The notification is wired via NotificationConfiguration below.
  onUpload:
    handler: src/handlers/onUpload.handler

resources:
  Resources:
    # Orders — PK only, plus a stream (NEW_AND_OLD_IMAGES) feeding onOrderStream.
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: orders-Orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    OrderQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: orders-OrderQueue
        VisibilityTimeout: 60
        MessageRetentionPeriod: 345600

    OrderEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: orders-OrderEvents

    # S3 bucket with a notification that fires the onUpload Lambda whenever a
    # new object is created under the "incoming/" prefix.
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: orders-uploads
        NotificationConfiguration:
          LambdaConfigurations:
            - Event: s3:ObjectCreated:*
              Function:
                Fn::GetAtt:
                  - OnUploadLambdaFunction
                  - Arn
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: incoming/

package:
  individually: false
