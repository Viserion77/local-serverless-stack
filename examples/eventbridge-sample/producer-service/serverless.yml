service: producer-service

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  environment:
    EVENT_BUS_NAME: domain-events
    AWS_ENDPOINT: http://localhost:14566

plugins:
  - serverless-lss

custom:
  orchestrator:
    enabled: true
    orchestratorUrl: http://localhost:3130
  lss:
    apiPort: 3621
    invokePort: 13621

functions:
  # POST /signups — publishes UserSignedUp to the shared bus via plain SDK
  # PutEvents. The bus itself is owned by events-stack; this service only
  # needs the name.
  signup:
    handler: src/handlers/signup.handler
    events:
      - httpApi:
          path: /signups
          method: post
