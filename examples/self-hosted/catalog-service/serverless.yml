service: catalog-service

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: dev
  httpApi:
    cors: true
  environment:
    # The collection endpoint the LSS self engine serves: <engine>/_aoss/<collection>.
    # On real AWS you would read it from GetAtt ProductsCollection.CollectionEndpoint.
    OPENSEARCH_ENDPOINT: http://localhost:14566/_aoss/products-catalog
    PRODUCTS_INDEX: products
    # DynamoDB vector search: the embeddings table and its vector index.
    EMBEDDINGS_TABLE: catalog-embeddings
    EMBEDDINGS_INDEX: ProductEmbeddingIndex
  # Declaration, not enforcement: OpenSearch Serverless has one data-plane
  # action, so the stack map draws this grant as read & write.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - aoss:APIAccessAll
          Resource:
            Fn::GetAtt: [ProductsCollection, Arn]
        # The vector handlers: putEmbedding writes, similarProducts reads the
        # source item and runs the vector search.
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:SearchVectors
          Resource:
            Fn::GetAtt: [CatalogEmbeddingsTable, Arn]

custom:
  lss:
    apiPort: 3634
    invokePort: 13634

functions:
  # POST /products — indexes a product document into OpenSearch.
  createProduct:
    handler: src/handlers/createProduct.handler
    events:
      - httpApi:
          path: /products
          method: post

  # GET /products/{id} — fetches one document by id.
  getProduct:
    handler: src/handlers/getProduct.handler
    events:
      - httpApi:
          path: /products/{id}
          method: get

  # DELETE /products/{id} — removes the document.
  deleteProduct:
    handler: src/handlers/deleteProduct.handler
    events:
      - httpApi:
          path: /products/{id}
          method: delete

  # GET /search?q=&category=&maxPrice= — full-text search + filters.
  searchProducts:
    handler: src/handlers/searchProducts.handler
    events:
      - httpApi:
          path: /search
          method: get

  # GET /stats — terms + avg aggregations over the whole catalog.
  categoryStats:
    handler: src/handlers/categoryStats.handler
    events:
      - httpApi:
          path: /stats
          method: get

  # PUT /products/{id}/embedding — derives a (toy) embedding from the product
  # text and stores it in DynamoDB.
  putEmbedding:
    handler: src/handlers/putEmbedding.handler
    events:
      - httpApi:
          path: /products/{id}/embedding
          method: put

  # GET /products/{id}/similar?k=5 — SearchVectors over the vector index,
  # scoped to the product's category.
  similarProducts:
    handler: src/handlers/similarProducts.handler
    events:
      - httpApi:
          path: /products/{id}/similar
          method: get

resources:
  Resources:
    # DynamoDB vector index (GA on AWS 2026-08-05): the embedding is a plain
    # list attribute; SearchVectors ranks items by cosine distance to a query
    # vector, within one `category` (the index's HASH). Vector indexes are
    # on-demand only — PAY_PER_REQUEST is required.
    CatalogEmbeddingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: catalog-embeddings
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: category
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
        VectorIndexes:
          - IndexName: ProductEmbeddingIndex
            VectorAttribute:
              AttributeName: embedding
            SearchSchema:
              - AttributeName: category
                SearchSchemaElementType: HASH
            Projection:
              ProjectionType: ALL
            Dimensions: 8
            DistanceFunction: COSINE

    ProductsCollection:
      Type: AWS::OpenSearchServerless::Collection
      Properties:
        Name: products-catalog
        Type: SEARCH
        Description: Product catalog full-text search

    # On AWS a collection cannot be created without an encryption policy and is
    # unreachable without a data-access policy. LSS accepts and skips both with
    # a registration warning — nothing enforces them locally — so the template
    # stays deployable as-is to the real cloud.
    ProductsEncryptionPolicy:
      Type: AWS::OpenSearchServerless::SecurityPolicy
      Properties:
        Name: products-encryption
        Type: encryption
        Policy: '{"Rules":[{"ResourceType":"collection","Resource":["collection/products-catalog"]}],"AWSOwnedKey":true}'

    ProductsAccessPolicy:
      Type: AWS::OpenSearchServerless::AccessPolicy
      Properties:
        Name: products-access
        Type: data
        Policy: '[{"Rules":[{"ResourceType":"index","Resource":["index/products-catalog/*"],"Permission":["aoss:*"]}],"Principal":["arn:aws:iam::000000000000:role/local-dev"]}]'
