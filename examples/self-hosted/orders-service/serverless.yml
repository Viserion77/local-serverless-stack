service: orders-service

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: dev
  httpApi:
    cors: true
  environment:
    ORDERS_TABLE: orders-Orders
    # Queue URL shape served by the self engine: <endpoint>/<account>/<queue>.
    ORDERS_QUEUE_URL: http://localhost:14566/000000000000/orders-to-process
    AWS_ENDPOINT: http://localhost:14566

plugins:
  - serverless-lss

custom:
  orchestrator:
    enabled: true
    orchestratorUrl: http://localhost:14566
  lss:
    apiPort: 3631
    invokePort: 13631

functions:
  # POST /orders — stores the order in DynamoDB and enqueues it for billing.
  createOrder:
    handler: src/handlers/createOrder.handler
    events:
      - httpApi:
          path: /orders
          method: post

  # GET /orders — lists stored orders so each pipeline stage is observable.
  listOrders:
    handler: src/handlers/listOrders.handler
    events:
      - httpApi:
          path: /orders
          method: get

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: orders-Orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    OrdersToProcessQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: orders-to-process
        # Short visibility so a failing consumer retries (and gives up) fast
        # enough to watch in a demo — AWS's default is 30 s.
        VisibilityTimeout: 5
        # Queue-level redrive, enforced by the self engine: an order that
        # billing-service keeps rejecting is delivered twice and then moved to
        # the DLQ instead of blocking/vanishing. The DLQ is declared BELOW this
        # queue on purpose — LSS resolves the Fn::GetAtt from the template, so
        # declaration order does not matter.
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [OrdersToProcessDlq, Arn]
          maxReceiveCount: 2

    OrdersToProcessDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: orders-to-process-dlq
        # Poison messages are kept for a day so they can be inspected in the
        # dashboard's Queues tab (AWS's default is 4 days).
        MessageRetentionPeriod: 86400
