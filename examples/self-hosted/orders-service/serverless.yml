service: orders-service

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: dev
  httpApi:
    cors: true
  environment:
    ORDERS_TABLE: orders-Orders
    # Queue URL shape served by the self engine: <endpoint>/<account>/<queue>.
    ORDERS_QUEUE_URL: http://localhost:14566/000000000000/orders-to-process
    AWS_ENDPOINT: http://localhost:14566
  # The self engine does not enforce IAM — every call is already allowed. These
  # statements are declared anyway because they are the ONLY machine-readable
  # record of which resources a function is meant to touch, and the dashboard's
  # wiring graph reads them to draw `lambda → table` / `lambda → queue`. Writing
  # them here also keeps the local template honest against the deployed one,
  # where they are load-bearing.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            Fn::GetAtt: [OrdersTable, Arn]
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            Fn::GetAtt: [OrdersToProcessQueue, Arn]

custom:
  lss:
    apiPort: 3631
    invokePort: 13631

functions:
  # POST /orders — stores the order in DynamoDB and enqueues it for billing.
  createOrder:
    handler: src/handlers/createOrder.handler
    events:
      - httpApi:
          path: /orders
          method: post

  # GET /orders — lists stored orders so each pipeline stage is observable.
  listOrders:
    handler: src/handlers/listOrders.handler
    events:
      - httpApi:
          path: /orders
          method: get

  # GET /orders/web-check — an event function calling the orders-web web
  # function (below) through the URL CloudFormation would hand it on AWS.
  checkWebApp:
    handler: src/handlers/checkWebApp.handler
    environment:
      # `!Sub 'https://${OrdersWebEndpoint.DomainName}'` is the usual spelling;
      # osls would read that `${…}` as one of its own variables, so the same
      # value is built with Fn::Join. LSS resolves DomainName to the endpoint's
      # stable local port and rewrites https → http (webFunctions.rewriteHttpsInEnv).
      ORDERS_WEB_URL:
        Fn::Join: ['', ['https://', Fn::GetAtt: [OrdersWebEndpoint, DomainName]]]
    events:
      - httpApi:
          path: /orders/web-check
          method: get

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: orders-Orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    OrdersToProcessQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: orders-to-process
        # Short visibility so a failing consumer retries (and gives up) fast
        # enough to watch in a demo — AWS's default is 30 s.
        VisibilityTimeout: 5
        # Queue-level redrive, enforced by the self engine: an order that
        # billing-service keeps rejecting is delivered twice and then moved to
        # the DLQ instead of blocking/vanishing. The DLQ is declared BELOW this
        # queue on purpose — LSS resolves the Fn::GetAtt from the template, so
        # declaration order does not matter.
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [OrdersToProcessDlq, Arn]
          maxReceiveCount: 2

    OrdersToProcessDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: orders-to-process-dlq
        # Poison messages are kept for a day so they can be inspected in the
        # dashboard's Queues tab (AWS's default is 4 days).
        MessageRetentionPeriod: 86400

    # --- orders-web: a Lambda Web Function -----------------------------------
    # An ordinary HTTP server (src/web/server.js, plain node:http) run as a
    # function. osls 4.0.0 has no `webApps:` key, so the three resources are
    # declared directly; osls passes them through and LSS reads them from the
    # packaged template. Nothing runs until the endpoint's URL is hit.
    OrdersWebFunction:
      Type: AWS::Lambda::WebFunction
      Properties:
        FunctionName: orders-web

    # Two revisions of the same code, split 90/10 by the endpoint — a canary.
    # Send `x-lss-web-revision: <RevisionId>` to pin one (the dashboard lists
    # the ids). Each revision is its own execution environment (process).
    OrdersWebRevision:
      Type: AWS::Lambda::WebFunctionRevision
      Properties:
        FunctionName:
          Ref: OrdersWebFunction
        Description: Orders status page, JSON API and SSE feed (stable)
        BuildConfig:
          CodeConfig:
            # On AWS: the versioned zip you uploaded. Locally (execution
            # "source" in lss.config.json) the code runs straight from this
            # service, entry AWS_LAMBDA_NODEJS_ENTRYPOINT.
            S3Object:
              Bucket:
                Ref: ServerlessDeploymentBucket
              Key: orders-service.zip
          RuntimeConfig:
            Runtime: nodejs24.x
        ServiceConfig:
          TimeoutSeconds: 10
          MaxConcurrencyPerEnvironment: 32
          EnvironmentVariables:
            AWS_LAMBDA_NODEJS_ENTRYPOINT: src/web/server.js
            ORDERS_TABLE:
              Ref: OrdersTable
            APP_TITLE: Acme Orders
            RELEASE_CHANNEL: stable

    OrdersWebRevisionCanary:
      Type: AWS::Lambda::WebFunctionRevision
      Properties:
        FunctionName:
          Ref: OrdersWebFunction
        Description: Same code, canary channel
        BuildConfig:
          CodeConfig:
            S3Object:
              Bucket:
                Ref: ServerlessDeploymentBucket
              Key: orders-service-canary.zip
          RuntimeConfig:
            Runtime: nodejs24.x
        ServiceConfig:
          TimeoutSeconds: 10
          MaxConcurrencyPerEnvironment: 32
          EnvironmentVariables:
            AWS_LAMBDA_NODEJS_ENTRYPOINT: src/web/server.js
            ORDERS_TABLE:
              Ref: OrdersTable
            APP_TITLE: Acme Orders
            RELEASE_CHANNEL: canary

    # The HTTPS URL. Locally: http://localhost:<port>, the port taken from
    # webFunctions.portRange (15000-15999) and kept across restarts.
    OrdersWebEndpoint:
      Type: AWS::Lambda::WebFunctionEndpoint
      Properties:
        FunctionName:
          Ref: OrdersWebFunction
        EndpointName: live
        EndpointType: HomeRegion
        AuthType: ApplicationManaged
        RevisionWeights:
          - RevisionId:
              Fn::GetAtt: [OrdersWebRevision, RevisionId]
            Weight: 90
          - RevisionId:
              Fn::GetAtt: [OrdersWebRevisionCanary, RevisionId]
            Weight: 10
