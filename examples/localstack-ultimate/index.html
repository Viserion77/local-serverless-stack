<!--
  Validation console for the "localstack-ultimate" example — open this file
  directly (file://) or serve it with `npm run console` (port 8621).
  Everything below the "Runtime (shared)" marker is byte-identical across the
  three example consoles; only the header and the CONFIG object vary.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localstack-ultimate · validation console</title>
<style>
  :root {
    --accent: #b45309; --bg: #f8fafc; --panel: #ffffff; --text: #0f172a;
    --muted: #64748b; --border: #e2e8f0; --ok: #16a34a; --err: #dc2626;
    --code-bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #fbbf24; --bg: #0b1220; --panel: #101a2e; --text: #e2e8f0;
      --muted: #94a3b8; --border: #1e293b; --ok: #4ade80; --err: #f87171;
      --code-bg: #0f172a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .logo { width: 44px; height: 44px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; letter-spacing: .5px; flex: none; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  header .links { margin-left: auto; display: flex; gap: 10px; }
  header .links a { color: var(--accent); text-decoration: none; font-size: 13px; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  section { margin-bottom: 28px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .status-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .status { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  .status small { color: var(--muted); }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: wait; }
  .flow { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .flow-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .flow-head h3 { margin: 0; font-size: 15px; }
  .flow-head p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 260px; }
  .steps { margin-top: 10px; display: none; }
  .flow.open .steps { display: block; }
  .step { border-top: 1px dashed var(--border); padding: 10px 0; }
  .step .sig { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .step .sig .method { color: var(--accent); font-weight: 700; }
  textarea { width: 100%; min-height: 64px; margin-top: 6px; font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .result { margin-top: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; display: none; }
  .result.show { display: block; }
  .result .http-ok { color: var(--ok); font-weight: 700; }
  .result .http-err { color: var(--err); font-weight: 700; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 18px; }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; max-height: 180px; overflow: auto; }
</style>
</head>
<body>
<header>
  <div class="logo">LU</div>
  <div>
    <h1>localstack-ultimate</h1>
    <p>LSS + LocalStack Pro image (Ultimate) — serverless-offline integration path</p>
  </div>
  <div class="links" id="links"></div>
</header>
<main>
  <section>
    <h2>Status <button class="ghost" style="padding:2px 10px;font-size:12px" onclick="checkAll()">refresh</button></h2>
    <div class="status-grid" id="statuses"></div>
  </section>
  <section>
    <h2>Flows</h2>
    <div id="flows"></div>
  </section>
  <section>
    <h2>Request log</h2>
    <div id="log">—</div>
  </section>
</main>
<footer>Generated for the LSS example "localstack-ultimate" — open this file directly or via <code>npm run console</code>.</footer>
<script>
// ---------------------------------------------------------------------------
// CONFIG — the only JS block builders customize per example.
// ---------------------------------------------------------------------------
const CONFIG = {
  // Links shown top-right: [label, url]
  links: [
    ['Dashboard', 'http://localhost:3111'],
  ],
  // Health checks: {label, url, note}  (any 2xx/3xx/4xx response counts as "up";
  // only network failure marks it down — LocalStack/engine endpoints often 404.)
  statuses: [
    { label: 'LSS orchestrator', url: 'http://localhost:3111/api/health', note: ':3111' },
    { label: 'serverless-offline', url: 'http://localhost:3002/dev/health', note: ':3002' },
    { label: 'LocalStack Pro', url: 'http://localhost:4571/_localstack/health', note: ':4571', opaque: true },
  ],
  // Flows: {title, desc, steps: [{name, method, url, body?, headers?, extract?}]}
  //  - body: object (editable in the UI as JSON) or undefined
  //  - extract: {ctxKey: 'json.path.in.response'} — saved into ctx after the step
  //  - url/body/header values support {{ctxKey}} substitution
  flows: [
    {
      title: 'Health check',
      desc: 'Pings the health route served by serverless-offline (stage prefix /dev).',
      steps: [
        { name: 'health', method: 'GET', url: 'http://localhost:3002/dev/health' },
      ],
    },
    {
      title: 'Create user → list users',
      desc: 'POSTs a new user into DynamoDB (Users table), then lists the table — seeded users appear alongside the new one.',
      steps: [
        {
          name: 'create user', method: 'POST', url: 'http://localhost:3002/dev/users',
          body: { name: 'Dora Console', email: 'dora@example.com' },
          extract: { userId: 'userId' },
        },
        { name: 'list users', method: 'GET', url: 'http://localhost:3002/dev/users' },
      ],
    },
    {
      title: 'Enqueue order → verify SQS consumption',
      desc: 'POSTs an order onto the SQS queue, waits for the processOrderQueue Lambda, then scans the Orders table via the LSS API — the stored item carries status/total/processedAt added by the consumer.',
      steps: [
        {
          name: 'enqueue order', method: 'POST', url: 'http://localhost:3002/dev/orders',
          body: { userId: 'u-alice', items: [{ sku: 'BOOK-02', price: 42, qty: 1 }] },
          extract: { orderId: 'order.orderId' },
          pause: 3000,
        },
        {
          name: 'scan Orders for the processed item', method: 'POST',
          url: 'http://localhost:3111/api/dynamo/tables/localstack-ultimate-Orders/scan',
          body: { filterExpression: 'orderId = :o', expressionAttributeValues: { ':o': '{{orderId}}' } },
        },
      ],
    },
    {
      title: 'Order → EventBridge bus → audit trail',
      desc: 'POSTs an order; after storing it, processOrderQueue does PutEvents (order.processed) onto the ultimate-order-events bus, the auditEvents rule (pattern filter on source) writes it into the AuditTrail table — read back via GET /audit.',
      steps: [
        {
          name: 'enqueue order', method: 'POST', url: 'http://localhost:3002/dev/orders',
          body: { userId: 'u-bob', items: [{ sku: 'MUG-RED', price: 12, qty: 2 }] },
          extract: { auditOrderId: 'order.orderId' },
          pause: 4000,
        },
        { name: 'list audit trail (look for order.processed with the new orderId)', method: 'GET', url: 'http://localhost:3002/dev/audit' },
      ],
    },
    {
      title: 'Poison order → DLQ redrive',
      desc: 'POSTs an order whose computed total is 0 — processOrderQueue throws and reports it as a batch item failure, SQS re-delivers it every 10s (short visibility timeout) and, after the 3rd receive, redrives it to localstack-ultimate-OrderProcessingDLQ. The flow waits ~35s, then peeks the DLQ via the LSS API; it is also visible in the dashboard\'s Queues tab.',
      steps: [
        {
          name: 'enqueue poison order (total <= 0)', method: 'POST', url: 'http://localhost:3002/dev/orders',
          body: { userId: 'u-alice', items: [{ sku: 'BROKEN', price: 0, qty: 1 }] },
          pause: 35000,
        },
        { name: 'peek DLQ (message count > 0 after redrive)', method: 'GET', url: 'http://localhost:3111/api/queues/localstack-ultimate-OrderProcessingDLQ' },
      ],
    },
    {
      title: 'Schedule → purge expired sessions',
      desc: 'Nothing to trigger here: purgeSessions runs on rate(2 minutes), deletes Sessions rows whose expiresAt is in the past (the seed ships one already-expired session) and publishes sessions.purged onto the bus. Run this a couple of minutes after seeding: the expired session is gone and the audit trail shows the schedule runs.',
      steps: [
        {
          name: 'scan Sessions (s-expired-demo disappears after the first run)', method: 'POST',
          url: 'http://localhost:3111/api/dynamo/tables/localstack-ultimate-Sessions/scan',
          body: {},
        },
        { name: 'list audit trail (look for sessions.purged entries)', method: 'GET', url: 'http://localhost:3002/dev/audit' },
      ],
    },
    {
      title: 'Upload → S3 notification → list uploads',
      desc: 'POSTs a file under incoming/ (fires the S3 → onUpload Lambda), waits, lists the bucket, then scans Orders for the record the onUpload Lambda wrote.',
      steps: [
        {
          name: 'upload file', method: 'POST', url: 'http://localhost:3002/dev/uploads',
          body: { filename: 'console-hello.txt', content: 'hello from the validation console' },
          extract: { uploadKey: 'key' },
          pause: 3000,
        },
        { name: 'list uploads', method: 'GET', url: 'http://localhost:3002/dev/uploads?prefix=incoming/' },
        {
          name: 'scan Orders for the onUpload record', method: 'POST',
          url: 'http://localhost:3111/api/dynamo/tables/localstack-ultimate-Orders/scan',
          body: { filterExpression: 'orderId = :k', expressionAttributeValues: { ':k': 'localstack-ultimate-uploads/{{uploadKey}}' } },
        },
      ],
    },
    {
      title: 'Catalog: index, search, aggregate, delete (OpenSearch Serverless)',
      desc: 'Indexes a product into the ultimate-products collection — LocalStack has no aoss in any edition, so the collection is served by the LSS aoss sidecar (:14567) — then fetches it by id, runs a filtered full-text search, reads the category aggregations and deletes it.',
      steps: [
        {
          name: 'index product', method: 'POST', url: 'http://localhost:3002/dev/products',
          body: { name: 'Wireless Mouse', category: 'peripherals', price: 25, tags: ['usb', 'wireless'] },
          extract: { productId: 'id' },
          pause: 1000,
        },
        { name: 'get product by id', method: 'GET', url: 'http://localhost:3002/dev/products/{{productId}}' },
        { name: 'search (full-text + filters)', method: 'GET', url: 'http://localhost:3002/dev/search?q=wireless&category=peripherals&maxPrice=50' },
        { name: 'category stats (aggregations)', method: 'GET', url: 'http://localhost:3002/dev/stats' },
        { name: 'delete product', method: 'DELETE', url: 'http://localhost:3002/dev/products/{{productId}}' },
      ],
    },
  ],
};
// ---------------------------------------------------------------------------
// Runtime (shared — do not customize below this line)
// ---------------------------------------------------------------------------
const ctx = {};
const $ = (s, el) => (el || document).querySelector(s);
const logEl = $('#log');
function log(line) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent = (logEl.textContent === '—' ? '' : logEl.textContent + '\n') + `[${t}] ${line}`;
  logEl.scrollTop = logEl.scrollHeight;
}
function subst(v) {
  if (typeof v === 'string') return v.replace(/\{\{(\w+)\}\}/g, (_, k) => ctx[k] ?? '');
  if (Array.isArray(v)) return v.map(subst);
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, subst(x)]));
  return v;
}
function pluck(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }

for (const [label, url] of CONFIG.links) {
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.textContent = label;
  $('#links').appendChild(a);
}
CONFIG.statuses.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'status';
  div.innerHTML = `<span class="dot" id="dot-${i}"></span> ${s.label} <small>${s.note || ''}</small>`;
  $('#statuses').appendChild(div);
});
async function checkAll() {
  await Promise.all(CONFIG.statuses.map(async (s, i) => {
    const dot = $(`#dot-${i}`);
    dot.className = 'dot';
    try { await fetch(s.url, { mode: s.opaque ? 'no-cors' : 'cors' }); dot.className = 'dot ok'; }
    catch { dot.className = 'dot err'; }
  }));
}
CONFIG.flows.forEach((flow, fi) => {
  const card = document.createElement('div');
  card.className = 'flow';
  const stepsHtml = flow.steps.map((st, si) => `
    <div class="step">
      <div class="sig"><span class="method">${st.method}</span> ${st.url}</div>
      ${st.body !== undefined ? `<textarea id="body-${fi}-${si}" spellcheck="false">${JSON.stringify(st.body, null, 2)}</textarea>` : ''}
      <div class="result" id="res-${fi}-${si}"></div>
    </div>`).join('');
  card.innerHTML = `
    <div class="flow-head">
      <h3>${flow.title}</h3><p>${flow.desc}</p>
      <button class="ghost" onclick="this.closest('.flow').classList.toggle('open')">steps</button>
      <button id="run-${fi}" onclick="runFlow(${fi})">Run</button>
    </div>
    <div class="steps">${stepsHtml}</div>`;
  $('#flows').appendChild(card);
});
async function runFlow(fi) {
  const flow = CONFIG.flows[fi];
  const btn = $(`#run-${fi}`);
  btn.disabled = true;
  document.querySelectorAll(`[id^="res-${fi}-"]`).forEach(r => { r.className = 'result'; r.textContent = ''; });
  $('#flows').children[fi].classList.add('open');
  try {
    for (let si = 0; si < flow.steps.length; si++) {
      const st = flow.steps[si];
      const res = $(`#res-${fi}-${si}`);
      const url = subst(st.url);
      const init = { method: st.method, headers: subst(st.headers || {}) };
      const bodyEl = $(`#body-${fi}-${si}`);
      if (bodyEl) {
        init.headers['content-type'] = 'application/json';
        init.body = JSON.stringify(subst(JSON.parse(bodyEl.value)));
      }
      log(`${st.method} ${url}`);
      let httpRes, text;
      try {
        httpRes = await fetch(url, init);
        text = await httpRes.text();
      } catch (e) {
        res.className = 'result show';
        res.innerHTML = `<span class="http-err">NETWORK ERROR</span> ${e.message} — is the service up?`;
        log(`  ✗ network error: ${e.message}`);
        return;
      }
      let parsed; try { parsed = JSON.parse(text); } catch { parsed = text; }
      const okClass = httpRes.ok ? 'http-ok' : 'http-err';
      res.className = 'result show';
      res.innerHTML = `<span class="${okClass}">HTTP ${httpRes.status}</span>\n` +
        (typeof parsed === 'string' ? parsed : JSON.stringify(parsed, null, 2));
      log(`  → ${httpRes.status}`);
      if (st.pause) await new Promise(r => setTimeout(r, st.pause));
      if (!httpRes.ok && !st.allowFail) return;
      if (st.extract && typeof parsed === 'object') {
        for (const [k, p] of Object.entries(st.extract)) {
          ctx[k] = pluck(parsed, p);
          log(`  ctx.${k} = ${JSON.stringify(ctx[k])}`);
        }
      }
    }
  } finally { btn.disabled = false; }
}
checkAll();
</script>
</body>
</html>
