name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    name: Unit Tests (100% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests with coverage gate
        run: npm run test:coverage

  integration:
    name: Integration Tests (self engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # v2 removed the LocalStack backend: the engine runs in the orchestrator
    # process, so this job needs no Docker, no service container and no secret.
    # It is therefore unconditional — under v1 it skipped itself whenever the
    # LocalStack auth token was absent, which was most of the time.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (sample-microservice fixture)
        run: npm ci --prefix tests/integration/fixtures/sample-microservice

      - name: Build project
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript (server)
        run: npx tsc --project src/server/tsconfig.json --noEmit

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d dist/server
          test -d dist/ui
          test -d dist/client
          test -f dist/client/index.js
          test -f bin/cli.js
