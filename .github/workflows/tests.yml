name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    name: Unit Tests (100% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests with coverage gate
        run: npm run test:coverage

  integration:
    name: Integration Tests (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ubuntu-latest runners ship Docker; LocalStack runs as an unprivileged
    # container. Gated on the token: community images >= 2026.5 require it.
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: npm ci

      - name: Install dependencies (sample-microservice fixture)
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: npm ci --prefix tests/integration/fixtures/sample-microservice

      - name: Build project
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: npm run build

      - name: Run integration tests
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: npm run test:integration

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript (server)
        run: npx tsc --project src/server/tsconfig.json --noEmit

      - name: Check TypeScript (plugin)
        run: npx tsc --project packages/serverless-plugin/tsconfig.json --noEmit

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d dist/server
          test -d dist/ui
          test -d dist/client
          test -f dist/client/index.js
          test -d packages/serverless-plugin/dist
          test -f bin/cli.js
