service: users-service

frameworkVersion: '>=3'

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: dev
  environment:
    USERS_TABLE: users-Users
    SESSION_SECRET: lss-secret
    EVENT_BUS_NAME: domain-events
    AWS_ENDPOINT: http://localhost:14572
  httpApi:
    cors: true
    authorizers:
      sessionAuthorizerV2:
        type: request
        functionName: sessionAuthorizerV2Local
        identitySource:
          - $request.header.authorization
        resultTtlInSeconds: 3600
        enableSimpleResponses: true
        payloadVersion: '2.0'

plugins:
  - serverless-lss

custom:
  orchestrator:
    enabled: true
    orchestratorUrl: http://localhost:3397
  lss:
    apiPort: 3610
    invokePort: 13610

functions:
  # v2 "simple response" authorizer ({isAuthorized, context}) — no events; it
  # backs the named provider.httpApi.authorizers entry above.
  sessionAuthorizerV2Local:
    handler: src/handlers/session-authorizer-v2.handler

  listUsers:
    handler: src/handlers/listUsers.handler
    events:
      - httpApi:
          path: /users
          method: get
          authorizer:
            name: sessionAuthorizerV2

  createUser:
    handler: src/handlers/createUser.handler
    events:
      - httpApi:
          path: /users
          method: post
          authorizer:
            name: sessionAuthorizerV2

  getUser:
    handler: src/handlers/getUser.handler
    events:
      - httpApi:
          path: /users/{id}
          method: get
          authorizer:
            name: sessionAuthorizerV2

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users-Users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    # ---------------------------------------------------------------------
    # RAW AWS::ApiGatewayV2::* routes hanging off the FRAMEWORK'S OWN HttpApi.
    #
    # This is the shape a real serverless.yml produces when a service keeps its
    # normal `httpApi:` events (above) AND hand-writes extra routes here: there
    # is no second ::Api — `ApiId: !Ref HttpApi` points at the ::Api the
    # framework compiled for the httpApi events, and every reference uses the
    # `!Sub` idiom rather than `!Join`/literals:
    #
    #   Target:        !Sub 'integrations/${LogicalId}'
    #   AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/
    #                        2015-03-31/functions/${LogicalId.Arn}/invocations'
    #   FunctionName:  !Ref  LogicalId          (a NAME in CFN, not an ARN)
    #   SourceArn:     !Sub '...:${HttpApi}/*'
    #
    # AuthorizerUri/IntegrationUri are NOT plain Lambda ARNs here — they are the
    # API Gateway *invocation URI* wrapper, which LSS unwraps back to the inner
    # Lambda ARN. And because the SAME template also carries the framework's
    # compiled ::Route mirrors of the httpApi events above, the raw assembler's
    # (METHOD, path) de-dup keeps /users, /users/{id} single-registered while
    # these genuinely-raw paths are added.
    SpacesIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        IntegrationType: AWS_PROXY
        PayloadFormatVersion: '2.0'
        TimeoutInMillis: 30000
        IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListUsersLambdaFunction.Arn}/invocations'

    SpacesWriteIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        IntegrationType: AWS_PROXY
        PayloadFormatVersion: '2.0'
        TimeoutInMillis: 30000
        IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateUserLambdaFunction.Arn}/invocations'

    SpacesGetRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref HttpApi
        RouteKey: GET /api/identity/spaces
        Target: !Sub 'integrations/${SpacesIntegration}'
        AuthorizationType: CUSTOM
        AuthorizerId: !Ref IdentitySpacesAuthorizer

    SpacesPostRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref HttpApi
        RouteKey: POST /api/identity/spaces
        Target: !Sub 'integrations/${SpacesWriteIntegration}'
        AuthorizationType: CUSTOM
        AuthorizerId: !Ref IdentitySpacesAuthorizer

    IdentitySpacesAuthorizer:
      Type: AWS::ApiGatewayV2::Authorizer
      Properties:
        ApiId: !Ref HttpApi
        Name: identitySpacesAuthorizer
        AuthorizerType: REQUEST
        AuthorizerPayloadFormatVersion: '2.0'
        EnableSimpleResponses: true
        AuthorizerResultTtlInSeconds: 3600
        IdentitySource:
          - $request.header.authorization
        AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SessionAuthorizerV2LocalLambdaFunction.Arn}/invocations'

    SpacesInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Ref ListUsersLambdaFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

    SpacesWriteInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Ref CreateUserLambdaFunction
        Principal: apigateway.amazonaws.com
        SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

package:
  individually: false
