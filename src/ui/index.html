<!DOCTYPE html>
<!-- Static default only: src/ui/src/i18n resolves the real locale at boot
     (stored choice, else the browser's languages) and rewrites this attribute
     before the app mounts. -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Default mark; a project's `branding.favicon` replaces it at runtime. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>LSS Self Engine</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
